<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CEEYIT Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>CEEYIT Real-Time Chat App</h1>

    <div style="text-align: center; margin-bottom: 20px;">
      <button id="toggle-dark-mode" class="join-button" style="font-size: 18px;">
        <span id="mode-icon">🌙</span> Toggle Theme
      </button>
    </div>

    <div id="username-form" class="username-container">
      <input type="text" id="username-input" class="username-input" placeholder="Enter your username">
      <button id="join-chat" class="join-button">Join Chat</button>
    </div>

    <div id="chat-interface" class="chat-container" style="display: none;">
      <div class="chat-header">
        <h2>Chat Room</h2>
        <div class="user-status">
          <span class="online-indicator"></span>
          <p>Connected as: <span id="current-user"></span></p>
        </div>
      </div>
      <div id="messages" class="chat-messages"></div>
      <div id="typing-indicator"></div>
      <form id="message-form" class="message-form">
        <input id="message-input" class="message-input" autocomplete="off" placeholder="Type a message...">
        <button class="send-button" type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let username = '';
    let typing = false;
    let typingTimeout;
    const typingUsers = new Set();
    const seenMessages = new Set();

    const usernameForm = document.getElementById('username-form');
    const usernameInput = document.getElementById('username-input');
    const joinButton = document.getElementById('join-chat');
    const chatInterface = document.getElementById('chat-interface');
    const currentUserSpan = document.getElementById('current-user');
    const messagesContainer = document.getElementById('messages');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    const typingIndicator = document.getElementById('typing-indicator');
    const toggleBtn = document.getElementById('toggle-dark-mode');
    const icon = document.getElementById('mode-icon');

    const observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        const el = entry.target;
        const messageId = el.dataset.messageId;
        const isSelf = el.dataset.self === 'true';

        if (entry.isIntersecting && !isSelf && messageId && !seenMessages.has(messageId)) {
          socket.emit('message seen', messageId);
          seenMessages.add(messageId);
        }
      }
    }, { threshold: 1.0 });

    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
      icon.textContent = '🌞';
    }

    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('darkMode', isDark);
      icon.textContent = isDark ? '🌞' : '🌙';
    });

    joinButton.addEventListener('click', () => {
      username = usernameInput.value.trim();
      if (!username) return alert("Please enter a username.");
      usernameForm.style.display = 'none';
      chatInterface.style.display = 'block';
      currentUserSpan.textContent = username;
      socket.emit('user joined', username);
    });

    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (text) {
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        socket.emit('chat message', { text, user: username, time });
        messageInput.value = '';
        socket.emit('stop typing');
        typing = false;
      }
    });

    messageInput.addEventListener('input', () => {
      if (!typing) {
        typing = true;
        socket.emit('typing');
      }
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        typing = false;
        socket.emit('stop typing');
      }, 1000);
    });

    const messageElements = new Map(); // messageId => DOM element

    function appendMessage({ id, text, user, time, self, delivered, seen }) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', self ? 'sent' : 'received');
      msgDiv.dataset.messageId = id;
      msgDiv.dataset.self = self;

      const content = document.createElement('div');
      content.textContent = self ? text : `${user}: ${text}`;
      msgDiv.appendChild(content);

      const meta = document.createElement('div');
      meta.classList.add('message-meta');

      const timeSpan = document.createElement('span');
      timeSpan.textContent = time || '';
      meta.appendChild(timeSpan);

      if (self) {
        const tickSpan = document.createElement('span');
        tickSpan.id = `tick-${id}`;
        tickSpan.innerHTML = seen ? '✔✔' : delivered ? '✔' : '';
        tickSpan.style.color = seen ? 'green' : '#ccc';
        meta.appendChild(tickSpan);
      }

      msgDiv.appendChild(meta);
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      if (!self && id) {
        observer.observe(msgDiv);
      }

      if (id) {
        messageElements.set(id, msgDiv);
      }
    }

    socket.on('chat message', (msg) => {
      const self = msg.user === username;
      appendMessage({ ...msg, self, delivered: true, seen: self });
    });

    socket.on('message seen', ({ messageId }) => {
      const tick = document.getElementById(`tick-${messageId}`);
      if (tick) {
        tick.innerHTML = '✔✔';
        tick.style.color = 'green';
      }
    });

    socket.on('user joined', (user) => {
      if (user !== username) {
        typingUsers.delete(user);
        updateTypingIndicator();
        const note = document.createElement('div');
        note.className = 'system-message';
        note.textContent = `${user} has joined the chat`;
        messagesContainer.appendChild(note);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    });

    socket.on('user left', (user) => {
      typingUsers.delete(user);
      updateTypingIndicator();
      const note = document.createElement('div');
      note.className = 'system-message';
      note.textContent = `${user} has left the chat`;
      messagesContainer.appendChild(note);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });

    socket.on('user typing', (user) => {
      if (user !== username) {
        typingUsers.add(user);
        updateTypingIndicator();
      }
    });

    socket.on('user stopped typing', (user) => {
      typingUsers.delete(user);
      updateTypingIndicator();
    });

    function updateTypingIndicator() {
      if (typingUsers.size === 0) {
        typingIndicator.innerHTML = '';
        return;
      }

      const names = Array.from(typingUsers);
      const typingText = names.length === 1
        ? `${names[0]} is typing`
        : `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]} are typing`;

      typingIndicator.innerHTML = `<span>${typingText}</span>`;
    }
  </script>
</body>
</html>
