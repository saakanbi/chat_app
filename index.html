<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CEEYIT Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>CEEYIT Real-Time Chat App</h1>

    <div style="text-align: center; margin-bottom: 20px;">
      <button id="toggle-dark-mode" class="join-button" style="font-size: 18px;">
        <span id="mode-icon">🌙</span> Toggle Theme
      </button>
    </div>

    <div id="username-form" class="username-container">
      <input type="text" id="username-input" class="username-input" placeholder="Enter your username">
      <button id="join-chat" class="join-button">Join Chat</button>
    </div>

    <div id="chat-interface" class="chat-container" style="display: none;">
      <div class="chat-header">
        <h2>Chat Room</h2>
        <p>Connected as: <span id="current-user"></span></p>
      </div>
      <div id="messages" class="chat-messages"></div>
      <div id="typing-indicator"></div>
      <form id="message-form" class="message-form">
        <input id="message-input" class="message-input" autocomplete="off" placeholder="Type a message...">
        <button class="send-button" type="submit">Send</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let username = '';
    let typing = false;
    let typingTimeout;
    const typingUsers = new Set();

    const usernameForm = document.getElementById('username-form');
    const usernameInput = document.getElementById('username-input');
    const joinButton = document.getElementById('join-chat');
    const chatInterface = document.getElementById('chat-interface');
    const currentUserSpan = document.getElementById('current-user');
    const messagesContainer = document.getElementById('messages');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    const typingIndicator = document.getElementById('typing-indicator');
    const toggleBtn = document.getElementById('toggle-dark-mode');
    const icon = document.getElementById('mode-icon');

    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
      icon.textContent = '🌞';
    }

    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('darkMode', isDark);
      icon.textContent = isDark ? '🌞' : '🌙';
    });

    joinButton.addEventListener('click', () => {
      username = usernameInput.value.trim();
      if (username) {
        usernameForm.style.display = 'none';
        chatInterface.style.display = 'block';
        currentUserSpan.textContent = username;
        socket.emit('user joined', username);
      }
    });

    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (text) {
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        socket.emit('chat message', { text, user: username, time });
        messageInput.value = '';
        socket.emit('stop typing');
        typing = false;
      }
    });

    messageInput.addEventListener('input', () => {
      if (!typing) {
        typing = true;
        socket.emit('typing');
      }
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        typing = false;
        socket.emit('stop typing');
      }, 1000);
    });

      msgDiv.appendChild(content);

      const meta = document.createElement('div');
      meta.classList.add('message-meta');

      meta.appendChild(timeSpan);
