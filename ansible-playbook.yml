---
- name: Configure EC2 instance for Chat App
  hosts: chat_servers
  become: yes
  vars:
    app_dir: /home/ec2-user/chat-app
    node_version: 16.x

  tasks:
    - name: Update yum cache
      yum:
        update_cache: yes

    - name: Install EPEL repository
      yum:
        name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-7.noarch.rpm
        state: present
        
    - name: Install required packages
      yum:
        name:
          - nginx
          - git
          - curl
          - lsof
        state: present
        enablerepo: epel

    - name: Add NodeSource repository
      shell: |
        curl -fsSL https://rpm.nodesource.com/setup_{{ node_version }} | bash -
      args:
        warn: false

    - name: Install Node.js
      yum:
        name: nodejs
        state: present

    - name: Extract application files
      unarchive:
        src: /home/ec2-user/chat-app.tar.gz
        dest: "{{ app_dir }}"
        remote_src: yes
      become_user: ec2-user
      
    - name: Install npm dependencies
      npm:
        path: "{{ app_dir }}"
        state: present
      become_user: ec2-user

    - name: Create Nginx configuration
      copy:
        content: |
          server {
              listen 80;
              server_name {{ ansible_host }};

              location / {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_cache_bypass $http_upgrade;
              }
          }
        dest: /etc/nginx/conf.d/chat-app.conf

    - name: Create systemd service file
      copy:
        content: |
          [Unit]
          Description=Node.js Chat Application
          After=network.target

          [Service]
          User=ec2-user
          WorkingDirectory={{ app_dir }}
          ExecStart=/usr/bin/node app.js
          Restart=always
          RestartSec=10
          StandardOutput=syslog
          StandardError=syslog
          SyslogIdentifier=chat-app

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/chat-app.service

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Stop chat-app service if running
      systemd:
        name: chat-app
        state: stopped
      ignore_errors: yes
      
    - name: Kill any processes using port 3000
      shell: lsof -ti:3000 | xargs -r kill -9
      ignore_errors: yes

    - name: Enable and start chat-app service
      systemd:
        name: chat-app
        state: started
        enabled: yes

    - name: Enable and restart Nginx
      systemd:
        name: nginx
        state: restarted
        enabled: yes
        
    - name: Check chat-app service status
      command: systemctl status chat-app
      register: chat_app_status
      changed_when: false
      ignore_errors: yes
      
    - name: Display chat-app service status
      debug:
        var: chat_app_status.stdout_lines
        
    - name: Check nginx service status
      command: systemctl status nginx
      register: nginx_status
      changed_when: false
      ignore_errors: yes
      
    - name: Display nginx service status
      debug:
        var: nginx_status.stdout_lines