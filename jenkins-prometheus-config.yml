---
- name: Install Prometheus Pushgateway
  hosts: prometheus
  become: yes
  tasks:
    - name: Download Prometheus Pushgateway
      get_url:
        url: https://github.com/prometheus/pushgateway/releases/download/v1.6.0/pushgateway-1.6.0.linux-amd64.tar.gz
        dest: /tmp/pushgateway.tar.gz
        mode: '0644'

    - name: Extract Pushgateway
      unarchive:
        src: /tmp/pushgateway.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Copy Pushgateway binary
      copy:
        src: /tmp/pushgateway-1.6.0.linux-amd64/pushgateway
        dest: /usr/local/bin/pushgateway
        remote_src: yes
        mode: '0755'

    - name: Create Pushgateway systemd service
      copy:
        content: |
          [Unit]
          Description=Prometheus Pushgateway
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/pushgateway --web.listen-address=:9091

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/pushgateway.service
        owner: root
        group: root
        mode: '0644'

    - name: Start and enable Pushgateway
      systemd:
        name: pushgateway
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Add Pushgateway to Prometheus config
      blockinfile:
        path: /etc/prometheus/prometheus.yml
        block: |
          # Pushgateway job
          - job_name: 'pushgateway'
            honor_labels: true
            static_configs:
              - targets: ['localhost:9091']
        insertafter: "scrape_configs:"
      notify: restart prometheus

  handlers:
    - name: restart prometheus
      systemd:
        name: prometheus
        state: restarted